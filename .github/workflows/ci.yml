name: Deploy to Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: 🧪 Automated Testing & Syntax Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kendat_integrated_services
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, fileinfo, ctype, json, mbstring, openssl
          coverage: none

      - name: 📝 Configure Environment (.env)
        run: |
          cp .env.example .env
          echo "" >> .env
          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_NAME=kendat_integrated_services" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASS=root" >> .env

      - name: 🔍 Lint PHP Syntax (php -l)
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./scratch/*" -exec php -l {} +

      - name: 🗄️ Run Migrations Engine
        run: php database/migrator.php

      - name: 🧪 Run Automated Test Suite
        run: php tests/run_tests.php

  deploy:
    name: 🚀 SFTP/SSH Deploy to Production (Port 22 Only)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: 🔒 SFTP/SSH Sync to Server (Port 22)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: 22
          local_path: './*'
          remote_path: ${{ secrets.SFTP_TARGET_DIR }}
          delete_remote: false
          exclude: |
            .git/
            .github/
            node_modules/
            vendor/
            uploads/
            adminpictures/
            storage/
            scratch/
            .env
            .env.example
            *.sql
            *.zip
            error_log.txt
