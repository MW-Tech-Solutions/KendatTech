name: Deploy to Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: 🧪 Automated Testing & Syntax Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kendat_integrated_services
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, fileinfo, ctype, json, mbstring, openssl
          coverage: none

      - name: 📝 Configure Environment (.env)
        run: |
          cp .env.example .env
          echo "" >> .env
          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_NAME=kendat_integrated_services" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASS=root" >> .env

      - name: 🔍 Lint PHP Syntax (php -l)
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./scratch/*" -exec php -l {} +

      - name: 🗄️ Run Migrations Engine
        run: php database/migrator.php

      - name: 🧪 Run Automated Test Suite
        run: php tests/run_tests.php

  deploy:
    name: 🚀 FTP Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for changed-files detection

      - name: 📂 Sync files to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/uploads/**
            **/adminpictures/**
            **/storage/**
            **/*.sql
            **/*.zip
            **/error_log.txt
            **/scratch/**
            **/.env