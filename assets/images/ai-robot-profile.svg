<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" fill="none">
  <defs>
    <linearGradient id="cyberHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="cyberDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cyberBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Decorative Cyber Shapes -->
  <rect x="180" y="40" width="360" height="260" rx="36" transform="rotate(-15 180 40)" fill="#10B981" opacity="0.18"/>
  <rect x="320" y="380" width="180" height="90" rx="18" transform="rotate(-20 320 380)" fill="#F59E0B" opacity="0.95"/>
  <rect x="60" y="160" width="300" height="300" rx="40" transform="rotate(-25 60 160)" fill="#059669" opacity="0.35"/>

  <!-- Robot Neck Assembly -->
  <path d="M 220 440 L 320 440 L 350 590 L 190 590 Z" fill="url(#cyberDark)"/>
  <rect x="225" y="465" width="90" height="12" rx="6" fill="#334155"/>
  <rect x="220" y="495" width="100" height="12" rx="6" fill="#334155"/>
  <rect x="215" y="525" width="110" height="12" rx="6" fill="#334155"/>
  <path d="M 270 445 L 270 580" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 6" filter="url(#glowFilter)"/>

  <!-- Robot Shoulder & Torso Base -->
  <path d="M 120 590 Q 270 540 420 590 L 460 650 L 80 650 Z" fill="url(#cyberHead)"/>
  <path d="M 170 600 Q 270 560 370 600" stroke="#10B981" stroke-width="4" fill="none" filter="url(#glowFilter)"/>

  <!-- Robot Cranium (Back Head) -->
  <path d="M 120 280 C 110 160 210 80 340 80 C 430 80 480 130 480 200 C 480 280 410 320 370 340 C 340 355 330 420 310 440 C 270 450 200 445 180 430 C 140 400 125 340 120 280 Z" fill="url(#cyberHead)"/>
  
  <!-- Back Head Segment Lines -->
  <path d="M 170 180 C 220 120 280 110 340 110" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M 150 240 C 200 190 260 170 330 170" stroke="#38BDF8" stroke-width="2.5" fill="none" filter="url(#glowFilter)"/>
  <path d="M 140 310 C 190 280 250 260 310 260" stroke="#94A3B8" stroke-width="3" fill="none"/>

  <!-- Robot Ear Module (Core Audio/Sensor Disc) -->
  <circle cx="280" cy="280" r="48" fill="url(#cyberDark)"/>
  <circle cx="280" cy="280" r="44" stroke="#64748B" stroke-width="3" fill="none"/>
  <circle cx="280" cy="280" r="32" stroke="#38BDF8" stroke-width="4" fill="none" filter="url(#glowFilter)"/>
  <circle cx="280" cy="280" r="18" fill="#0EA5E9"/>
  <circle cx="280" cy="280" r="8" fill="#FFFFFF"/>

  <!-- Robot Face Shell (Profile Forehead, Nose, Lips, Chin) -->
  <path d="M 340 80 C 390 82 430 110 440 160 C 445 185 435 210 430 220 L 450 250 C 455 258 450 268 440 270 L 425 272 C 430 285 435 295 430 305 L 415 310 C 425 325 425 345 405 365 L 360 395 C 330 415 310 435 295 440" stroke="#E2E8F0" stroke-width="2" fill="none"/>
  <path d="M 330 90 C 380 95 420 120 430 170 C 435 195 420 215 415 225 L 442 252 C 446 256 443 264 436 266 L 418 268 C 424 280 426 290 422 298 L 406 304 C 418 318 416 338 398 355 L 350 385 C 320 405 305 425 290 435 L 280 360 C 300 320 330 270 335 230 C 340 180 335 130 330 90 Z" fill="url(#cyberHead)"/>

  <!-- Optical Eye Sensor (Glowing Mint/Cyan) -->
  <path d="M 390 195 Q 415 190 425 205 Q 410 215 390 205 Z" fill="#0F172A"/>
  <ellipse cx="408" cy="200" rx="9" ry="5" fill="#38BDF8" filter="url(#glowFilter)"/>
  <circle cx="408" cy="200" r="3" fill="#FFFFFF"/>

  <!-- Temple & Cheek Circuit Traces -->
  <path d="M 320 200 L 370 200 L 385 220" stroke="#10B981" stroke-width="2.5" fill="none" filter="url(#glowFilter)"/>
  <circle cx="320" cy="200" r="3" fill="#10B981"/>
  <path d="M 310 240 L 350 240 L 370 260 L 390 260" stroke="#38BDF8" stroke-width="2" fill="none" filter="url(#glowFilter)"/>
  <circle cx="390" cy="260" r="3" fill="#38BDF8"/>
  <path d="M 300 330 L 340 330 L 360 350" stroke="#10B981" stroke-width="2" fill="none"/>

  <!-- Chin Sensor Port -->
  <rect x="365" y="365" width="16" height="6" rx="3" fill="#334155"/>
  <circle cx="373" cy="368" r="2" fill="#34D399" filter="url(#glowFilter)"/>

  <!-- High-Gloss Specular Highlights -->
  <path d="M 220 110 C 270 95 320 95 360 105" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 432 150 C 438 175 432 195 425 210" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
